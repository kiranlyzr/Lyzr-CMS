<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>Product Pages CMS — Lyzr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --surface:#fff; --fill:#F1F0EE; --line:#E3E1DE;
  --text:#1F2022; --soft:#6B675F; --muted:#8A857C;
  --accent:#FE4B1E; --accent-h:#E5401A; --accent-tint:rgba(254,75,30,.12); --error:#C43A13;
  --sans:"Aeonik Pro","Aeonik","Figtree","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
button,input{font:inherit;color:inherit}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:36px 32px}
.lz-logo{height:26px;width:auto;display:block;margin-bottom:28px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
h1{font-weight:400;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:10px 0 6px}
.sub{color:var(--soft);font-size:14px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--soft);margin-bottom:6px}
.field input{width:100%;height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:4px;top:4px;height:36px;padding:0 10px;background:none;border:0;border-radius:4px;font-size:13px;color:var(--soft);cursor:pointer}
.pw button:hover{color:var(--text);background:var(--fill)}
.btn{width:100%;height:46px;margin-top:6px;background:var(--accent);color:#fff;border:0;border-radius:4px;font-size:15px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--accent-h)}
.btn[disabled]{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:12px;font-size:13px;color:var(--error)}
.note{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <svg class="lz-logo" viewBox="2.449 0 198.551 34" role="img" aria-label="Lyzr">
  <path fill="var(--mk,#FE4B1E)" d="M55 21L47.6267 34H2.89478L55 21Z"/>
  <path fill="var(--mk,#FE4B1E)" d="M43.9352 9.21432L40.3648 20.8969L2.44928 31.9337L43.9352 9.21432Z"/>
  <path fill="var(--mk,#FE4B1E)" d="M34.1098 10.6493L34.0641 5.80164e-05C33.0913 5.51002 29.7951 9.74939 20.8644 18.5746L34.1098 10.6493Z"/>
  <path fill="var(--wm,#1F2022)" d="M67 34.0002V30.9005L71.5415 30.1256V3.97175L67 3.19682V0.097109H81.8808V3.19682L77.146 3.97175V30.1256C79.0303 30.4646 81.301 30.7068 83.7651 30.7068C89.0313 30.7068 94.0077 29.3507 97.0515 25.476H100.627L95.2155 34.0002H67Z"/>
  <path fill="var(--wm,#1F2022)" d="M104.675 34.0002V30.9005L109.313 30.1256V24.1199L98.2975 3.97175L94.6256 3.19682V0.097109H108.83V3.19682L104.385 3.97175L112.792 19.7609H112.985L121.585 3.97175L117.14 3.19682V0.097109H129.605V3.24526L125.643 3.97175L114.918 23.5387V30.1256L119.556 30.9005V34.0002H104.675Z"/>
  <path fill="var(--wm,#1F2022)" d="M129.995 34.0002V31.0943L153.959 3.77802C151.688 3.43899 149.321 3.29369 146.615 3.29369C140.769 3.29369 136.807 4.74668 134.537 8.81506H130.768L135.889 0.097109H162.655V2.61563L138.305 30.3193C140.817 30.6584 143.523 30.8037 146.615 30.8037C153.041 30.8037 157.341 29.3507 160.046 25.2823H163.815L158.694 34.0002H129.995Z"/>
  <path fill="var(--wm,#1F2022)" d="M166.214 34.0002V30.9005L170.949 30.1256V3.97175L166.214 3.19682V0.097109H176.36C178.437 0.097109 181.674 0.000244141 183.22 0.000244141C192.158 0.000244141 197.521 3.39056 197.521 9.15409C197.521 15.1114 191.869 17.7267 186.312 18.1142C188.003 19.5188 189.791 21.0686 192.497 24.3136L197.521 30.3193L201 30.7068V34.0002H192.883C191.144 31.8692 183.993 22.4732 180.321 18.4048H176.553V30.1256L181.384 30.9005V34.0002H166.214ZM176.553 15.2082H181.868C187.182 15.2082 190.854 13.8521 190.854 9.39626C190.854 5.08571 187.472 3.29369 182.496 3.29369C180.515 3.29369 178.437 3.58429 176.553 3.97175V15.2082Z"/>
</svg>
  <p class="label">Team access</p>
  <h1>Product Pages CMS</h1>
  <p class="sub">Sign in with the email and password you were given.</p>
  <form id="f" autocomplete="on" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="field"><label for="pw">Password</label>
      <div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="button" id="show" aria-label="Show password">Show</button></div>
    </div>
    <button class="btn" id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="note">Access is limited to the people assigned to this CMS. Sessions end after 24 hours.</p>
</main>
<script>
(function () {
  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  var pw = document.getElementById('pw'), show = document.getElementById('show');
  show.addEventListener('click', function () {
    var on = pw.type === 'password';
    pw.type = on ? 'text' : 'password';
    show.textContent = on ? 'Hide' : 'Show';
    show.setAttribute('aria-label', on ? 'Hide password' : 'Show password');
  });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    var email = document.getElementById('email').value.trim();
    var pass = pw.value;
    if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
    go.disabled = true; go.textContent = 'Signing in…';
    fetch('/auth/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'x-requested-with': 'cms' },
      body: JSON.stringify({ email: email, password: pass })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; });
    }).then(function (res) {
      if (res.ok) { location.replace('/'); return; }
      err.textContent = res.data.error || 'Sign-in failed. Please try again.';
      pw.value = '';
      go.disabled = false; go.textContent = 'Sign in';
    }).catch(function () {
      err.textContent = 'Could not reach the server. Check your connection and try again.';
      go.disabled = false; go.textContent = 'Sign in';
    });
  });
})();
</script>
</body>
</html>
